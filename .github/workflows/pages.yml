name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "live_results.json"
      - "pipeline/*.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p _site/pipeline
          # Stage every page (glob avoids the recurring "forgot to add a page" bug)
          cp *.html _site/
          cp live_results.json _site/
          # Stage exactly the JSON the pages fetch at runtime
          cp pipeline/ideas_queue.json pipeline/strategies_queue.json pipeline/status.json \
             pipeline/signals_last_update.json pipeline/signals_history.json _site/pipeline/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
